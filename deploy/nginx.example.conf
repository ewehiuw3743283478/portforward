# Reverse-proxy the panel with TLS. Set BIND_HOST=127.0.0.1 in .env so the
# Node process is not reachable except through nginx, then:
#
#   COOKIE_SECURE=true
#   TRUST_PROXY=true
#
# Replace panel.example.com and the upstream port (default 392).

upstream portforward {
    server 127.0.0.1:392;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://portforward;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
